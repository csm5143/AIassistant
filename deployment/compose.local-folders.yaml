# Opt-in, read-only mount. Choose one host directory in .env.docker.
services:
  backend:
    environment:
      KNOWLEDGE_LOCAL_FOLDERS_ENABLED: "true"
      KNOWLEDGE_FOLDER_ROOTS: /documents
    volumes:
      - type: bind
        source: ${LOCAL_DOCUMENTS_DIR:-E:/资源}
        target: /documents
        read_only: true
        bind:
          create_host_path: false
