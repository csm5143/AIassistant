server:
  port: 8740
  tomcat:
    # Drain rejected uploads around the limit so the client can receive HTTP 413.
    max-swallow-size: 110MB
  servlet:
    context-path: /api

spring:
  application:
    name: ai-assistant-backend
  security:
    filter:
      dispatcher-types: request, async, error, forward
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/aiassitant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PWD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PWD:}
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      # Allow multipart headers alongside a file exactly 100 MiB in size.
      max-request-size: 101MB
      location: ${UPLOAD_TMP_DIR:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/mysql
  datasource-pg:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/aivectors
    username: ${PG_USER}
    password: ${PG_PWD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  mvc:
    async:
      request-timeout: 0
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 200

ai:
  embedding:
    base-url: ${EMB_BASE_URL}
    api-key: ${EMB_KEY}
  pgvector:
    url: ${PG_URL:jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/aivectors}
    user: ${PG_USER}
    password: ${PG_PWD}
    table: kb_vectors
  chat:
    memory-window: 20
    max-output-tokens: 4096
  cleaning:
    model: ${CLEANING_MODEL:deepseek-chat}
  rag:
    top-k: 8
    min-score: 0.0
    min-relevance: 0.5
    chunk-size: 500
    chunk-overlap: 80
    hybrid:
      enabled: true
      vector-top-k: 10
      bm25-top-k: 10
      rerank-top-k: 3
      rerank-model: BAAI/bge-reranker-v2-m3
  config:
    encryption:
      key: ${ENCRYPTION_KEY:${JWT_SECRET:}}
  guard:
    enabled: true
    input-block-on-hit: true
    output-mask: "[已过滤]"
  web:
    scraper:
      playwright-enabled: false
      playwright-timeout: 30000
      playwright-wait: 2000
      cookies-file: ${SCRAPER_COOKIES_FILE:}
      thin-content-threshold: 300
  search:
    exa:
      enabled: true
      base-url: ${EXA_MCP_URL:https://mcp.exa.ai/mcp}
      timeout-seconds: 30
    mcporter:
      timeout-seconds: 45
      config-path: ${MCPORTER_CONFIG:config/mcporter.json}
  mcp:
    auto-discover: true
    refresh-interval-ms: 600000
    initial-delay-ms: 15000
    mcporter-timeout-seconds: 20

jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: 60
  refresh-ttl-days: 7
  issuer: ai-assistant

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: true
    swagger-model-name: AI Assistant API

logging:
  level:
    root: INFO
    com.aiproject: DEBUG
    org.springframework.security: INFO
    dev.langchain4j: INFO
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

server.tomcat:
  threads:
    max: 200
  accept-count: 100

# No local document roots are opened until explicitly configured.
ai.knowledge.storage-dir: ${KNOWLEDGE_STORAGE_DIR:D:/AIassistant-env/runtime/uploads/knowledge}
ai.knowledge.local-folders-enabled: ${KNOWLEDGE_LOCAL_FOLDERS_ENABLED:false}
ai.knowledge.folder-roots: ${KNOWLEDGE_FOLDER_ROOTS:}
ai.pdf.parser-url: ${PDF_PARSER_URL:http://127.0.0.1:8741}
ai.pdf.parser-token: ${PDF_PARSER_TOKEN:}
ai.pdf.runtime-dir: ${PDF_PARSER_RUNTIME:D:/AIassistant-env/runtime/pdf-parser}
ai.pdf.vision-max-images: ${PDF_VISION_MAX_IMAGES:8}
